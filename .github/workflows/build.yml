name: Build
on:
    push:
        branches:
            - "*"
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24.x"

            - name: Install dependencies
              run: npm install

            - name: TypeScript
              run: npm run typescript

            - name: Test
              run: npm run test

            - name: Bundle
              run: npm run build
